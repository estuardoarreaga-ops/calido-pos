# Nombre de la aplicacion
spring.application.name=franquicia

# Configuracion de Base de Datos para pruebas locales rapidas (H2 en memoria)
spring.datasource.url=jdbc:h2:mem:posdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Consola web para ver la Base de Datos desde el navegador (http://localhost:8080/h2-console)
spring.h2.console.enabled=true

# Hibernate/JPA: Crea y actualiza las tablas SQL automaticamente segun nuestras clases Java
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===================================================================
# CONFIGURACION FUTURA PARA POSTGRESQL (NUBE / PRODUCCION)
# Solo tendras que descomentar estas lineas cuando tengamos la BD real:
# ===================================================================
# spring.datasource.url=jdbc:postgresql://localhost:5432/pos_franquicia
# spring.datasource.username=postgres
# spring.datasource.password=tu_contrasena
# spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# ==========================================
# CONFIGURACION PARA TUNELES (localhost.run / ngrok)
# ==========================================
# Permite que Spring Boot acepte peticiones desde dominios externos
server.forward-headers-strategy=framework

# Configuracion de Tomcat para aceptar encabezados remotos
server.tomcat.remoteip.remote-ip-header=x-forwarded-for
server.tomcat.remoteip.protocol-header=x-forwarded-proto

# (Opcional) Si usas Spring Boot 3.x para evitar restricciones de Host
server.tomcat.relax-query-chars=|,{}